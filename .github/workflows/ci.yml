name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'main'
      - 'readme-screenshot-base'

jobs:
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ^1.22

      - name: Test
        run: go test -cover -coverprofile=coverage.txt -mod=readonly ./...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.txt

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: unit_tests
    permissions:
      contents:      read  # to download code coverage results from unit_tests job
      pull-requests: write # write permission needed to comment on PR
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # The -baseline-* flags of fgrosse/go-coverage-report#110 are not released yet, so we build
      # the binary from that branch. GITHUB_PATH takes precedence over the binary the action downloads.
      - name: Install go-coverage-report from fgrosse/go-coverage-report#110
        run: |
          go install github.com/fgrosse/go-coverage-report/cmd/go-coverage-report@375e47666a137a3774cd54d5dcdb78846ba82ca2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: fgrosse/go-coverage-report@baseline-selection
